services:
  # ----------------------------------------------------
  # 1. WhatsApp AI Backend Server (API + Sockets + AI Bot)
  # ----------------------------------------------------
  - type: web
    name: whatsapp-ai-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WHATSAPP_SESSION_PATH
        value: ./auth_info_baileys

  # ----------------------------------------------------
  # 2. WhatsApp AI SaaS Dashboard (React + Vite + PWA)
  # ----------------------------------------------------
  - type: web
    name: whatsapp-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_URL
        sync: false
